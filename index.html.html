<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>📝 Daily Do List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FF7EB6; --yellow:#FFD86B; --mint:#5FE3B3; --sky:#6FC3FF; --lav:#B98BFF;
    --ink:#3A2E4D; --ink-soft:#8A7FA0; --card:#FFFFFF; --line:#F0E7FA; --radius:22px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Mali','Noto Sans Thai',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 10% 8%, rgba(255,126,182,.28), transparent 40%),
      radial-gradient(circle at 90% 5%, rgba(111,195,255,.28), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(95,227,179,.22), transparent 45%),
      #FFFBF3;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px;}
  h1{font-size:26px;font-weight:700;margin:0;background:linear-gradient(90deg,var(--pink),var(--lav),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .tagline{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .overview-btn{
    border:none;background:linear-gradient(135deg,var(--lav),var(--sky));color:#fff;font-weight:700;
    padding:10px 16px;border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit;
    box-shadow:0 4px 14px rgba(111,140,255,.35);white-space:nowrap;
  }

  .date-nav{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--card);border-radius:999px;padding:8px 10px;box-shadow:0 4px 16px rgba(150,120,200,.12);margin-bottom:14px;
  }
  .date-nav button{
    border:none;background:var(--line);color:var(--ink);width:34px;height:34px;border-radius:50%;
    font-size:16px;cursor:pointer;font-family:inherit;flex-shrink:0;
  }
  .date-nav .date-mid{flex:1;text-align:center;}
  .date-nav .date-big{font-size:16px;font-weight:700;}
  .date-nav .today-jump{font-size:11px;color:var(--lav);cursor:pointer;font-weight:600;text-decoration:underline;background:none;border:none;font-family:inherit;padding:2px 0;}

  .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 6px 22px rgba(150,120,200,.14);margin-bottom:14px;}

  .mood-row{display:flex;gap:8px;margin-bottom:14px;justify-content:center;}
  .mood-btn{border:2px solid var(--line);background:#FFFCF6;border-radius:14px;font-size:20px;padding:6px 0;flex:1;cursor:pointer;transition:transform .15s;}
  .mood-btn.selected{border-color:var(--pink);background:#FFF0F6;transform:scale(1.08);}

  .progress-wrap{margin-bottom:16px;}
  .progress-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .progress-track{height:12px;background:var(--line);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--mint),var(--sky),var(--lav));transition:width .4s ease;}

  .celebrate{
    display:none;background:linear-gradient(135deg,#FFF3D6,#FFE3EF);border:1px solid #FFD9EC;color:#B23B72;
    font-weight:700;font-size:13.5px;text-align:center;border-radius:14px;padding:10px;margin-bottom:14px;
  }
  .celebrate.show{display:block;animation:pop .4s ease;}
  @keyframes pop{0%{transform:scale(.9);opacity:0;}100%{transform:scale(1);opacity:1;}}

  .add-form{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .add-form input[type=text]{
    border:2px solid var(--line);border-radius:14px;padding:11px 14px;font-size:14.5px;font-family:inherit;background:#FFFCF6;color:var(--ink);
  }
  .add-form input[type=text]:focus, .add-form select:focus, .add-form input[type=time]:focus{outline:none;border-color:var(--lav);}
  .add-row2{display:flex;gap:8px;flex-wrap:wrap;}
  .add-row2 input[type=time]{border:2px solid var(--line);border-radius:14px;padding:9px 10px;font-size:13px;font-family:inherit;background:#FFFCF6;flex:1;min-width:100px;}
  .level-toggle{display:flex;gap:5px;flex:1.4;min-width:160px;}
  .level-btn{flex:1;border:2px solid var(--line);background:#FFFCF6;border-radius:14px;padding:8px 4px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--ink-soft);}
  .level-btn.selected.high{border-color:#FF6B6B;background:#FFEDED;color:#C0392B;}
  .level-btn.selected.normal{border-color:#FFB84D;background:#FFF4E1;color:#B4700A;}
  .level-btn.selected.low{border-color:#6FC3FF;background:#EAF6FF;color:#1B6FA8;}
  .add-form button{
    border:none;background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;font-weight:700;
    padding:11px;border-radius:14px;font-size:14.5px;cursor:pointer;font-family:inherit;
  }

  .task-list{display:flex;flex-direction:column;gap:8px;}
  .task{
    display:flex;align-items:center;gap:9px;background:#FFFCF6;border:2px solid var(--line);border-radius:16px;padding:10px 12px;
  }
  .task.done{opacity:.55;}
  .task.done .txt{text-decoration:line-through;}
  .chk{
    width:24px;height:24px;border-radius:50%;border:2px solid #D9CCF0;background:#fff;flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;
  }
  .task.done .chk{background:linear-gradient(135deg,var(--mint),var(--sky));border-color:transparent;}
  .lvl-dot{font-size:13px;flex-shrink:0;}
  .task .txt{flex:1;font-size:14px;line-height:1.4;word-break:break-word;}
  .task .time{font-size:11.5px;color:#B98BFF;font-weight:700;white-space:nowrap;background:#F3EBFF;padding:2px 8px;border-radius:999px;}
  .task .del{border:none;background:none;cursor:pointer;font-size:14px;flex-shrink:0;opacity:.6;}
  .empty-state{text-align:center;padding:26px 10px;color:var(--ink-soft);font-size:14px;}
  .empty-state .big{font-size:34px;margin-bottom:6px;}

  /* Overview modal */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(58,46,77,.55);z-index:50;
    align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto;
  }
  .modal-overlay.show{display:flex;}
  .modal{background:var(--card);border-radius:24px;max-width:560px;width:100%;padding:20px;margin-top:10px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-head h2{font-size:19px;margin:0;font-weight:700;}
  .modal-close{border:none;background:var(--line);width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;font-family:inherit;}

  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .month-nav button{border:none;background:var(--line);width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;font-family:inherit;}
  .month-nav .m-label{font-weight:700;font-size:15px;}
  .today-done-box{background:#F1FBF6;border:2px solid #D3F2E2;border-radius:14px;padding:12px 14px;margin-bottom:14px;}
  .today-done-box h3{font-size:13px;margin:0 0 8px;font-weight:700;color:#1E9E5C;}
  .today-done-item{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0;color:var(--ink);}
  .today-done-item .amt-time{font-size:11px;color:var(--ink-soft);margin-left:auto;}
  .today-done-empty{font-size:12.5px;color:var(--ink-soft);font-style:italic;}
  .money-breakdown{margin-top:10px;font-size:11.5px;color:var(--ink-soft);line-height:1.7;text-align:center;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:16px;}
  .cal-dow{font-size:10px;text-align:center;color:var(--ink-soft);font-weight:700;}
  .cal-cell{aspect-ratio:1;border-radius:10px;background:#FFFCF6;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;cursor:pointer;gap:2px;}
  .cal-cell.blank{visibility:hidden;cursor:default;}
  .cal-cell .cd-num{font-weight:700;}
  .cal-cell .cd-face{font-size:14px;}
  .cal-cell.today{border-color:var(--pink);border-width:2px;}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat-box{background:#FFFCF6;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;}
  .stat-box .s-num{font-size:20px;font-weight:700;background:linear-gradient(90deg,var(--pink),var(--lav));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat-box .s-label{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  footer{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:8px;line-height:1.6;}

  /* Fire urgent box */
  .fire-card{
    background:linear-gradient(135deg,#FF6B35,#F7931E 45%,#FF3D3D 100%);
    border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;position:relative;overflow:hidden;
    box-shadow:0 6px 22px rgba(255,90,31,.3);animation:fireGlow 1.6s ease-in-out infinite;
  }
  @keyframes fireGlow{0%,100%{box-shadow:0 0 12px 2px rgba(255,90,31,.5);}50%{box-shadow:0 0 24px 6px rgba(255,150,20,.75);}}
  .fire-card::after{content:"🔥";position:absolute;top:8px;right:14px;font-size:22px;animation:flicker 1s ease-in-out infinite alternate;}
  @keyframes flicker{0%{transform:scale(1) rotate(-6deg);}100%{transform:scale(1.18) rotate(6deg);}}
  .fire-card h2{color:#fff;font-size:15px;margin:0 0 10px;text-shadow:0 1px 3px rgba(0,0,0,.25);}
  .fire-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:160px;overflow-y:auto;}
  .fire-item{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);border-radius:12px;padding:8px 10px;font-size:13.5px;font-weight:600;color:#5C2A0A;}
  .fire-item.done{opacity:.55;text-decoration:line-through;}
  .fire-item .chk2{width:22px;height:22px;border-radius:50%;border:2px solid #E9A98F;background:#fff;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
  .fire-item.done .chk2{background:#B23A1D;border-color:transparent;}
  .fire-item .txt{flex:1;word-break:break-word;}
  .fire-item .del{border:none;background:none;cursor:pointer;font-size:13px;flex-shrink:0;}
  .fire-empty{font-size:12.5px;color:rgba(255,255,255,.92);font-style:italic;margin-bottom:10px;}
  .fire-add{display:flex;gap:6px;}
  .fire-add input{flex:1;border:none;border-radius:12px;padding:9px 12px;font-size:13.5px;font-family:inherit;background:rgba(255,255,255,.94);color:#5C2A0A;}
  .fire-add input::placeholder{color:#C15A28;}
  .fire-add button{border:none;background:#B23A1D;color:#fff;border-radius:12px;padding:9px 14px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}

  /* Expense card */
  .exp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .exp-head h2{font-size:15px;margin:0;font-weight:700;}
  .exp-total-pill{background:linear-gradient(135deg,var(--mint),var(--sky));color:#fff;font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px;}
  .exp-list{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;}
  .exp-item{display:flex;align-items:center;gap:8px;background:#FFFCF6;border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-size:13px;}
  .exp-item .txt{flex:1;word-break:break-word;}
  .exp-item .amt{font-weight:700;color:#B4700A;white-space:nowrap;}
  .exp-item .del{border:none;background:none;cursor:pointer;font-size:13px;flex-shrink:0;opacity:.6;}
  .exp-add{display:flex;gap:6px;flex-wrap:wrap;}
  .exp-add input[type=text]{flex:1.3;min-width:90px;border:2px solid var(--line);border-radius:12px;padding:9px 10px;font-size:13px;font-family:inherit;background:#FFFCF6;}
  .exp-add input[type=number]{flex:.8;min-width:70px;border:2px solid var(--line);border-radius:12px;padding:9px 10px;font-size:13px;font-family:inherit;background:#FFFCF6;}
  .exp-add select{flex:1;min-width:90px;border:2px solid var(--line);border-radius:12px;padding:9px 6px;font-size:12px;font-family:inherit;background:#FFFCF6;}
  .exp-add button{border:none;background:linear-gradient(135deg,var(--mint),var(--sky));color:#fff;font-weight:700;padding:9px 14px;border-radius:12px;font-size:13px;cursor:pointer;font-family:inherit;}
  .exp-empty{font-size:12.5px;color:var(--ink-soft);font-style:italic;text-align:center;padding:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>📝 Daily Do List</h1>
      <div class="tagline">จดสิ่งที่ต้องทำในแต่ละวันของคุณ ✨</div>
    </div>
    <button class="overview-btn" id="overviewBtn">📊 ดูภาพรวม</button>
  </header>

  <div class="fire-card">
    <h2>🔥🔥 ด่วนสุดๆ ห้ามลืมเด็ดขาด!! 🔥🔥</h2>
    <div class="fire-list" id="fireList"></div>
    <div class="fire-add">
      <input type="text" id="fireInput" placeholder="พิมพ์เรื่องด่วนแล้วกด +...">
      <button id="fireAddBtn">➕</button>
    </div>
  </div>

  <div class="date-nav">
    <button id="prevDayBtn">◀</button>
    <div class="date-mid">
      <div class="date-big" id="dateBig">–</div>
      <button class="today-jump" id="todayJumpBtn">กลับไปวันนี้</button>
    </div>
    <button id="nextDayBtn">▶</button>
  </div>

  <div class="card">
    <div class="mood-row" id="moodRow"></div>

    <div class="progress-wrap">
      <div class="progress-label"><span id="progressText">เสร็จแล้ว 0/0</span><span id="progressPct">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>

    <div class="celebrate" id="celebrateBox">🎉 เก่งมาก! ทำครบทุกอย่างของวันนี้แล้ว 🎉</div>

    <div class="add-form">
      <input type="text" id="taskInput" placeholder="✏️ อยากจดอะไรไว้ทำวันนี้...">
      <div class="add-row2">
        <input type="time" id="timeInput">
        <div class="level-toggle" id="levelToggle">
          <button type="button" class="level-btn high" data-level="high">🌟 สำคัญ</button>
          <button type="button" class="level-btn normal selected" data-level="normal">⭐ ปกติ</button>
          <button type="button" class="level-btn low" data-level="low">💤 ไม่รีบ</button>
        </div>
      </div>
      <button id="addBtn">➕ เพิ่มลงในสมุด</button>
    </div>

    <div class="task-list" id="taskList"></div>
  </div>

  <div class="card">
    <div class="exp-head">
      <h2>💸 ค่าใช้จ่ายวันนี้</h2>
      <span class="exp-total-pill" id="expTotalPill">฿0</span>
    </div>
    <div class="exp-list" id="expList"></div>
    <div class="exp-add">
      <input type="text" id="expLabelInput" placeholder="รายการ เช่น กาแฟ">
      <input type="number" id="expAmountInput" placeholder="บาท" min="0">
      <select id="expCatSelect">
        <option value="food">🍔 อาหาร</option>
        <option value="transport">🚗 เดินทาง</option>
        <option value="shopping">🛍️ ช้อปปิ้ง</option>
        <option value="other">📦 อื่นๆ</option>
      </select>
      <button id="expAddBtn">➕ บันทึก</button>
    </div>
  </div>

  <footer>💾 บันทึกอัตโนมัติในเครื่องนี้ · เปิดใหม่เมื่อไหร่ก็ยังอยู่ครบ</footer>
</div>

<div class="modal-overlay" id="overviewOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>📊 ภาพรวมของคุณ</h2>
      <button class="modal-close" id="closeOverviewBtn">✕</button>
    </div>
    <div class="month-nav">
      <button id="prevMonthBtn">◀</button>
      <span class="m-label" id="monthLabel">–</span>
      <button id="nextMonthBtn">▶</button>
    </div>
    <div class="today-done-box">
      <h3>✅ วันนี้ทำอะไรเสร็จแล้วบ้าง</h3>
      <div id="todayDoneList"></div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="stat-grid" id="statGrid"></div>
    <div class="money-breakdown" id="moneyBreakdown"></div>
  </div>
</div>

<script>
// Storage shim: use window.storage inside Claude, fall back to localStorage
// when this file is opened as a standalone deployed website.
if(typeof window.storage === "undefined"){
  window.storage = {
    async get(key){ try{ const v = localStorage.getItem(key); return v===null ? null : {key, value:v, shared:false}; }catch(e){ return null; } },
    async set(key, value){ try{ localStorage.setItem(key, value); return {key, value, shared:false}; }catch(e){ return null; } },
    async delete(key){ try{ localStorage.removeItem(key); return {key, deleted:true, shared:false}; }catch(e){ return null; } },
    async list(prefix){ try{ const keys = Object.keys(localStorage).filter(k=>!prefix||k.startsWith(prefix)); return {keys, prefix, shared:false}; }catch(e){ return null; } }
  };
}

const THAI_MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const THAI_DOW = ["จ","อ","พ","พฤ","ศ","ส","อา"];
const MOODS = ["😄","🙂","😐","😣","😴"];
const LEVEL_ICON = {high:"🌟", normal:"⭐", low:"💤"};

const CATS = [
  {key:"food", emoji:"🍔", label:"อาหาร"},
  {key:"transport", emoji:"🚗", label:"เดินทาง"},
  {key:"shopping", emoji:"🛍️", label:"ช้อปปิ้ง"},
  {key:"other", emoji:"📦", label:"อื่นๆ"}
];
function catInfo(k){ return CATS.find(c=>c.key===k) || {emoji:"📦",label:"อื่นๆ"}; }
function fmtBaht(n){ return "฿"+Math.round(n).toLocaleString("en-US"); }

const REAL_TODAY = new Date();
let viewDate = new Date(REAL_TODAY);
let selectedLevel = "normal";
let dayData = { tasks: [], mood: null, expenses: [] };
let fireItems = [];

function toKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function isSameDay(a,b){ return toKey(a)===toKey(b); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

async function loadDay(d){
  try{ const r = await window.storage.get("dd:"+toKey(d), false); return r ? normalizeDay(JSON.parse(r.value)) : {tasks:[], mood:null, expenses:[]}; }
  catch(e){ return {tasks:[], mood:null, expenses:[]}; }
}
function normalizeDay(d){ return { tasks:d.tasks||[], mood: d.mood!==undefined?d.mood:null, expenses: d.expenses||[] }; }
async function saveDay(d){
  try{ await window.storage.set("dd:"+toKey(d), JSON.stringify(dayData), false); }catch(e){}
}
async function loadFireItems(){
  try{ const r = await window.storage.get("dd:urgentFire", false); if(!r) return []; const v = JSON.parse(r.value); return Array.isArray(v)?v:[]; }
  catch(e){ return []; }
}
async function saveFireItems(){ try{ await window.storage.set("dd:urgentFire", JSON.stringify(fireItems), false); }catch(e){} }

function fmtDateBig(d){
  const dow = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"][d.getDay()];
  return dow+" "+d.getDate()+" "+THAI_MONTHS[d.getMonth()]+" "+(d.getFullYear()+543);
}

function renderMood(){
  const el = document.getElementById("moodRow");
  el.innerHTML = "";
  MOODS.forEach(m=>{
    const btn = document.createElement("button");
    btn.className = "mood-btn"+(dayData.mood===m?" selected":"");
    btn.textContent = m;
    btn.addEventListener("click", async ()=>{
      dayData.mood = dayData.mood===m ? null : m;
      await saveDay(viewDate);
      renderMood();
    });
    el.appendChild(btn);
  });
}

function renderTasks(){
  const list = document.getElementById("taskList");
  const tasks = dayData.tasks.slice().sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
  list.innerHTML = "";
  if(tasks.length===0){
    list.innerHTML = '<div class="empty-state"><div class="big">🌤️</div>ยังไม่มีอะไรต้องทำเลย<br>เริ่มจดสิ่งแรกกันเลย ✏️</div>';
  }
  tasks.forEach(t=>{
    const row = document.createElement("div");
    row.className = "task"+(t.done?" done":"");
    row.innerHTML = `
      <div class="chk">${t.done?"✓":""}</div>
      <span class="lvl-dot">${LEVEL_ICON[t.level]||"⭐"}</span>
      <span class="txt">${escapeHtml(t.text)}</span>
      ${t.time?`<span class="time">⏰ ${t.time}</span>`:""}
      <button class="del">🗑️</button>
    `;
    row.querySelector(".chk").addEventListener("click", async ()=>{
      t.done = !t.done;
      await saveDay(viewDate);
      renderTasks();
      renderProgress();
    });
    row.querySelector(".del").addEventListener("click", async ()=>{
      dayData.tasks = dayData.tasks.filter(x=>x.id!==t.id);
      await saveDay(viewDate);
      renderTasks();
      renderProgress();
    });
    list.appendChild(row);
  });
}

function renderProgress(){
  const total = dayData.tasks.length;
  const done = dayData.tasks.filter(t=>t.done).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("progressText").textContent = `เสร็จแล้ว ${done}/${total}`;
  document.getElementById("progressPct").textContent = pct+"%";
  document.getElementById("progressFill").style.width = pct+"%";
  const cel = document.getElementById("celebrateBox");
  if(total>0 && done===total){
    cel.classList.add("show");
  } else {
    cel.classList.remove("show");
  }
}

function renderExpenses(){
  const list = document.getElementById("expList");
  const items = dayData.expenses || [];
  list.innerHTML = "";
  if(items.length===0){
    list.innerHTML = '<div class="exp-empty">ยังไม่มีรายจ่ายวันนี้ 🌱</div>';
  }
  items.forEach(ex=>{
    const c = catInfo(ex.category);
    const row = document.createElement("div");
    row.className = "exp-item";
    row.innerHTML = `
      <span class="txt">${c.emoji} ${escapeHtml(ex.label)}</span>
      <span class="amt">${fmtBaht(ex.amount)}</span>
      <button class="del">🗑️</button>
    `;
    row.querySelector(".del").addEventListener("click", async ()=>{
      dayData.expenses = dayData.expenses.filter(x=>x.id!==ex.id);
      await saveDay(viewDate);
      renderExpenses();
    });
    list.appendChild(row);
  });
  const total = items.reduce((s,e)=>s+e.amount,0);
  document.getElementById("expTotalPill").textContent = fmtBaht(total);
}

async function addExpense(){
  const labelInput = document.getElementById("expLabelInput");
  const amountInput = document.getElementById("expAmountInput");
  const catSelect = document.getElementById("expCatSelect");
  const label = labelInput.value.trim();
  const amount = parseFloat(amountInput.value);
  if(!label || isNaN(amount) || amount<0) return;
  dayData.expenses.push({ id: uid(), label, amount, category: catSelect.value });
  labelInput.value=""; amountInput.value="";
  await saveDay(viewDate);
  renderExpenses();
  labelInput.focus();
}
document.getElementById("expAddBtn").addEventListener("click", addExpense);
document.getElementById("expLabelInput").addEventListener("keydown", e=>{ if(e.key==="Enter") addExpense(); });
document.getElementById("expAmountInput").addEventListener("keydown", e=>{ if(e.key==="Enter") addExpense(); });

function renderFireList(){
  const list = document.getElementById("fireList");
  list.innerHTML = "";
  if(fireItems.length===0){
    list.innerHTML = '<div class="fire-empty">ยังไม่มีรายการ — พิมพ์ด้านล่างแล้วกด ➕</div>';
    return;
  }
  fireItems.forEach(it=>{
    const row = document.createElement("div");
    row.className = "fire-item"+(it.done?" done":"");
    row.innerHTML = `
      <div class="chk2">${it.done?"✓":""}</div>
      <span class="txt">${escapeHtml(it.text)}</span>
      <button class="del">🗑️</button>
    `;
    row.querySelector(".chk2").addEventListener("click", async ()=>{
      it.done = !it.done; await saveFireItems(); renderFireList();
    });
    row.querySelector(".del").addEventListener("click", async ()=>{
      fireItems = fireItems.filter(x=>x.id!==it.id);
      await saveFireItems(); renderFireList();
    });
    list.appendChild(row);
  });
}

async function addFireItem(){
  const input = document.getElementById("fireInput");
  const text = input.value.trim();
  if(!text) return;
  fireItems.push({ id: uid(), text, done:false });
  input.value = "";
  await saveFireItems();
  renderFireList();
}
document.getElementById("fireAddBtn").addEventListener("click", addFireItem);
document.getElementById("fireInput").addEventListener("keydown", e=>{ if(e.key==="Enter") addFireItem(); });

async function renderDayView(){
  document.getElementById("dateBig").textContent = fmtDateBig(viewDate);
  dayData = await loadDay(viewDate);
  renderMood();
  renderTasks();
  renderProgress();
  renderExpenses();
}

document.getElementById("prevDayBtn").addEventListener("click", ()=>{
  viewDate.setDate(viewDate.getDate()-1); renderDayView();
});
document.getElementById("nextDayBtn").addEventListener("click", ()=>{
  viewDate.setDate(viewDate.getDate()+1); renderDayView();
});
document.getElementById("todayJumpBtn").addEventListener("click", ()=>{
  viewDate = new Date(REAL_TODAY); renderDayView();
});

document.querySelectorAll(".level-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".level-btn").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");
    selectedLevel = btn.dataset.level;
  });
});

async function addTask(){
  const textInput = document.getElementById("taskInput");
  const timeInput = document.getElementById("timeInput");
  const text = textInput.value.trim();
  if(!text) return;
  dayData.tasks.push({ id: uid(), text, time: timeInput.value||"", level: selectedLevel, done:false });
  textInput.value = ""; timeInput.value = "";
  await saveDay(viewDate);
  renderTasks();
  renderProgress();
  textInput.focus();
}
document.getElementById("addBtn").addEventListener("click", addTask);
document.getElementById("taskInput").addEventListener("keydown", e=>{ if(e.key==="Enter") addTask(); });

/* ---------- Overview modal ---------- */
let overviewMonth = new Date(REAL_TODAY.getFullYear(), REAL_TODAY.getMonth(), 1);

function faceFor(total, done){
  if(total===0) return "•";
  if(done===total) return "🥳";
  if(done>0) return "🙂";
  return "😴";
}

async function renderOverview(){
  document.getElementById("monthLabel").textContent = THAI_MONTHS[overviewMonth.getMonth()]+" "+(overviewMonth.getFullYear()+543);
  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";
  THAI_DOW.forEach(d=>{ const el=document.createElement("div"); el.className="cal-dow"; el.textContent=d; grid.appendChild(el); });

  renderTodayDoneBox();

  const year = overviewMonth.getFullYear(), month = overviewMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay()+6)%7; // Monday=0
  const daysInMonth = new Date(year, month+1, 0).getDate();

  for(let i=0;i<startOffset;i++){
    const blank = document.createElement("div"); blank.className="cal-cell blank"; grid.appendChild(blank);
  }

  let monthTotal=0, monthDone=0, fullDays=0, activeDays=0, monthSpent=0;
  const catTotals = {};

  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(year, month, day);
    const data = await loadDay(d);
    const total = data.tasks.length;
    const done = data.tasks.filter(t=>t.done).length;
    monthTotal += total; monthDone += done;
    if(total>0){ activeDays++; if(done===total) fullDays++; }
    (data.expenses||[]).forEach(e=>{
      monthSpent += e.amount;
      const c = e.category || "other";
      catTotals[c] = (catTotals[c]||0) + e.amount;
    });

    const cell = document.createElement("div");
    cell.className = "cal-cell"+(isSameDay(d,REAL_TODAY)?" today":"");
    cell.innerHTML = `<span class="cd-num">${day}</span><span class="cd-face">${faceFor(total,done)}</span>`;
    cell.addEventListener("click", ()=>{
      viewDate = d;
      renderDayView();
      closeOverview();
    });
    grid.appendChild(cell);
  }

  const statGrid = document.getElementById("statGrid");
  const pct = monthTotal ? Math.round(monthDone/monthTotal*100) : 0;
  statGrid.innerHTML = `
    <div class="stat-box"><div class="s-num">${monthTotal}</div><div class="s-label">งานทั้งหมดเดือนนี้</div></div>
    <div class="stat-box"><div class="s-num">${pct}%</div><div class="s-label">ทำเสร็จแล้ว</div></div>
    <div class="stat-box"><div class="s-num">${fullDays}</div><div class="s-label">วันที่ทำครบ 100%</div></div>
    <div class="stat-box"><div class="s-num">${fmtBaht(monthSpent)}</div><div class="s-label">💰 ใช้เงินเดือนนี้</div></div>
  `;

  const moneyBreakdown = document.getElementById("moneyBreakdown");
  const parts = CATS.map(c=>{
    const amt = catTotals[c.key]||0;
    return amt>0 ? `${c.emoji} ${c.label} ${fmtBaht(amt)}` : null;
  }).filter(Boolean);
  moneyBreakdown.textContent = parts.length ? parts.join(" · ") : "";
}

async function renderTodayDoneBox(){
  const todayData = isSameDay(viewDate, REAL_TODAY) ? dayData : await loadDay(REAL_TODAY);
  const el = document.getElementById("todayDoneList");
  const done = (todayData.tasks||[]).filter(t=>t.done);
  const todaySpent = (todayData.expenses||[]).reduce((s,e)=>s+e.amount,0);
  if(done.length===0){
    el.innerHTML = '<div class="today-done-empty">ยังไม่มีงานที่เสร็จวันนี้เลย</div>';
  } else {
    el.innerHTML = done.map(t=>`<div class="today-done-item">✅ ${escapeHtml(t.text)}${t.time?`<span class="amt-time">⏰ ${t.time}</span>`:""}</div>`).join("");
  }
  const spentLine = document.createElement("div");
  spentLine.className = "today-done-item";
  spentLine.innerHTML = `💰 ใช้เงินไปวันนี้แล้ว <span class="amt-time" style="margin-left:4px;font-weight:700;color:#B4700A;">${fmtBaht(todaySpent)}</span>`;
  el.appendChild(spentLine);
}

function openOverview(){
  overviewMonth = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  document.getElementById("overviewOverlay").classList.add("show");
  renderOverview();
}
function closeOverview(){
  document.getElementById("overviewOverlay").classList.remove("show");
}
document.getElementById("overviewBtn").addEventListener("click", openOverview);
document.getElementById("closeOverviewBtn").addEventListener("click", closeOverview);
document.getElementById("overviewOverlay").addEventListener("click", (e)=>{
  if(e.target.id==="overviewOverlay") closeOverview();
});
document.getElementById("prevMonthBtn").addEventListener("click", ()=>{
  overviewMonth.setMonth(overviewMonth.getMonth()-1); renderOverview();
});
document.getElementById("nextMonthBtn").addEventListener("click", ()=>{
  overviewMonth.setMonth(overviewMonth.getMonth()+1); renderOverview();
});

renderDayView();
(async ()=>{
  fireItems = await loadFireItems();
  renderFireList();
})();
</script>
